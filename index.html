<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under The Tuba Tree | Stories • Dreams • Deen</title>
  <meta name="description" content="Under The Tuba Tree - An enchanted author brand for children's literature, Islamic storytelling, and cultural values by Tuba Seyal.">

  <!-- Google Fonts Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Preload Critical Hero Assets -->
  <link rel="preload" as="image" href="assets/hero-bg.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="assets/reader.png" fetchpriority="high">
  <link rel="preload" as="image" href="assets/logo-tree.png">
  <link rel="preload" as="image" href="assets/top-branch.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar (Deep Plum) -->
  <header class="top-bar" id="topBar">
    <div class="top-bar__inner">
      <!-- Left decorative blossom branch -->
      <div class="top-bar__flourish" aria-hidden="true">
        <img src="assets/top-branch.png" alt="" class="top-bar__branch">
      </div>

      <!-- Centered Brand Pillars -->
      <p class="top-bar__tagline">
        Stories <span class="bullet" aria-hidden="true">•</span> Dreams <span class="bullet" aria-hidden="true">•</span> Deen
      </p>

      <!-- Right Social Icons + Story Circle CTA -->
      <div class="top-bar__actions">
        <div class="top-bar__socials" aria-label="Social Media">
          <a href="#instagram" class="social-link" aria-label="Instagram">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="#pinterest" class="social-link" aria-label="Pinterest">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 19l1.8-6.5m0 0c-.6-1-.5-2.6.5-3.4 1.2-1 3.4-.5 3.8 1.2.4 1.7-.7 3.7-2.2 3.7-.9 0-1.5-.6-1.3-1.4"/></svg>
          </a>
          <a href="#youtube" class="social-link" aria-label="YouTube">
            <svg width="15" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>

        <a href="#newsletter" class="top-bar__cta-btn">
          <svg class="cta-mail-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
          Join Our Story Circle
        </a>
      </div>
    </div>
  </header>

  <!-- Main Navigation -->
  <nav class="main-nav" id="mainNav" aria-label="Main Navigation">
    <div class="main-nav__inner">
      <a href="#" class="brand-logo" aria-label="Under The Tuba Tree Home">
        <span class="brand-logo__tree-wrap" aria-hidden="true">
          <img src="assets/logo-tree.png" alt="" class="brand-logo__tree">
        </span>
        <span class="brand-logo__text">
          Under The<br>Tuba Tree
        </span>
      </a>

      <!-- Desktop Navigation Links -->
      <ul class="nav-menu" id="navMenu">
        <li><a href="#" class="nav-link active">Home</a></li>
        <li>
          <a href="#books" class="nav-link nav-link--has-sub">
            Our Books
            <svg class="nav-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </a>
        </li>
        <li><a href="#story-garden" class="nav-link">The Story Garden</a></li>
        <li><a href="#author" class="nav-link">Meet The Author</a></li>
        <li>
          <a href="#resources" class="nav-link nav-link--has-sub">
            Resources
            <svg class="nav-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </a>
        </li>
        <li><a href="#journal" class="nav-link">Blog</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
        <li class="nav-search-item">
          <button type="button" class="nav-search-btn" aria-label="Search stories">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><line x1="20" y1="20" x2="16.4" y2="16.4"/></svg>
          </button>
        </li>
      </ul>

      <!-- Mobile Hamburger Button -->
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- Organic curved wave under the left logo -->
      <svg class="main-nav__wave" viewBox="0 0 430 26" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,0 L430,0 C368,0 322,24 215,24 C108,24 62,0 0,0 Z" fill="#FDF7F2"/>
        <path d="M0,0 C62,0 108,24 215,24 C322,24 368,0 430,0" fill="none" stroke="rgba(84, 45, 69, 0.14)" stroke-width="1"/>
      </svg>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section" id="heroSection" aria-label="Welcome Hero">

    <!-- Stage: 16:9 artwork container, anchored right, holds ALL overlays -->
    <div class="stage" id="stage">

      <!-- Background Scene (Hero Artwork) — NO object-fit crop -->
      <picture class="stage__picture">
        <source media="(max-width: 600px)" srcset="assets/hero-bg.jpg">
        <img src="assets/hero-bg.jpg"
             alt="Enchanted blooming tree at sunset with warm lanterns and distant palace"
             class="stage__bg" id="heroBg"
             fetchpriority="high" decoding="sync">
      </picture>

      <!-- Decorative Reader Character Layer (sits on grassy hill, behind glows & leaves) -->
      <div class="reader-character" id="readerCharacter" aria-hidden="true">
        <div class="reader-character__shadow"></div>
        <div class="reader-character__body">
          <img src="assets/reader.png"
               alt=""
               class="reader-character__img"
               id="readerImg"
               fetchpriority="high" decoding="async">
        </div>
      </div>

      <!-- Lantern Glow Layer (radial screen glows, % positioned inside stage) -->
      <div class="lantern-glows" id="lanternGlows" aria-hidden="true">
        <div class="glow lantern-1" style="left: 50.0%; top: 31.0%;"></div>
        <div class="glow lantern-2" style="left: 71.5%; top: 22.0%;"></div>
        <div class="glow lantern-3" style="left: 78.0%; top: 24.0%;"></div>
        <div class="glow lantern-4" style="left: 72.0%; top: 42.0%;"></div>
        <div class="glow lantern-5" style="left: 93.0%; top: 44.0%;"></div>
      </div>

      <!-- Sparkles / Fireflies Layer -->
      <div class="fireflies-layer" id="firefliesLayer" aria-hidden="true"></div>

      <!-- Falling Leaves Canvas Layer -->
      <canvas id="leavesCanvas" class="leaves-canvas" aria-hidden="true"></canvas>

    </div>
    <!-- /stage -->

    <!-- Hero Content (Left-aligned on Desktop, Center/Bottom on Mobile) -->
    <div class="hero-content" id="heroContent">
      <p class="hero-tagline" id="heroTagline">Every leaf holds a story...</p>
      <h1 class="hero-title" id="heroTitle">Under The<br>Tuba Tree</h1>
      <div class="hero-action" id="heroAction">
        <a href="#story-garden" class="btn-primary" id="exploreBtn">
          Explore the stories
        </a>
      </div>
    </div>

    <!-- Bottom Ground Floral Strip Layer -->
    <div class="ground-layer" aria-hidden="true">
      <img src="assets/ground.png" alt="" class="ground-img">
    </div>
  </section>

  <!-- The Story Garden Placeholder Section -->
  <section class="story-garden-section" id="story-garden">
    <div class="section-container">
      <h2 class="section-title">The Story Garden</h2>
      <p class="section-subtitle">A little world of stories waiting to grow.</p>
    </div>
  </section>

  <!-- Main JavaScript -->
  <script src="script.js"></script>
</body>
</html>
